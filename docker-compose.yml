version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: dio_n8n_rpa
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/scripts
      - ./data:/data

volumes:
  n8n_data:
